<div class="dashboard-container">
  <app-nav-bar 
    [userName]="user?.name || ''" 
    userRole="Líder de Aseguramiento" 
    [activeItem]="activeTab" 
    [navItems]="navItems" 
    (logout)="onLogout()"
    (navClick)="setTab($event)">
  </app-nav-bar>

  <div class="main-content">
    <!-- Header (Shared) -->
    <div class="header-section">
      <div>
        <h1>Bienvenida, {{ getUserFirstName() }}</h1>
        <div class="role-subtitle">
          <app-role-chip role="lider"></app-role-chip>
          <span>Visión global del sistema</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="export-tools">
          <button class="export-icon-btn pdf" title="Exportar PDF" (click)="exportToPDF()">
            <i class="material-icons">picture_as_pdf</i>
          </button>
          <button class="export-icon-btn excel" title="Exportar Excel" (click)="exportToExcel()">
            <i class="material-icons">description</i>
          </button>
        </div>
      </div>
    </div>

    <!-- Dynamic Content -->
    <router-outlet></router-outlet>
  </div>
</div>
