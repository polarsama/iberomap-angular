<div class="dashboard-container">
  <app-nav-bar 
    [userName]="user?.name || ''" 
    userRole="Decano — Facultad de Ingeniería" 
    [activeItem]="activeTab" 
    [navItems]="navItems" 
    (logout)="onLogout()"
    (navClick)="setTab($event)">
  </app-nav-bar>

  <div class="main-content">
    <!-- Header -->
    <div class="header-section">
      <div>
        <h1>Bienvenido, {{ getUserFirstName() }}</h1>
        <div class="role-subtitle">
          <app-role-chip role="decano"></app-role-chip>
          <span>Facultad de Ingeniería · 3 programas · vista de solo lectura</span>
        </div>
      </div>
    </div>

    <!-- Dynamic Content -->
    <div class="dynamic-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
